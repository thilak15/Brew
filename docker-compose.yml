version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    restart: unless-stopped
    volumes:
      # Optional: Mount `.env` if you prefer to use a .env file instead of system environment variables
      - ./backend/.env:/app/.env
      - ./debug_logs:/app/debug_logs

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      # By default, the frontend will connect to localhost:8000 when accessed from the host machine browser
      - NEXT_PUBLIC_WS_URL=ws://localhost:8000
    depends_on:
      - backend
    restart: unless-stopped
